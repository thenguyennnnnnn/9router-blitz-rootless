services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router-blitz-rootless:test
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "20128:20128"
    env_file:
      - .env.local
    volumes:
      - 9router_data:/app/data
    restart: unless-stopped

volumes:
  9router_data:
